services:
  web:
    build: .
    command: bun run start
    ports:
      - "3075:3075"
    volumes:
      - ./storage:/app/storage
      - ./content:/app/content
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3075/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: bun run worker
    volumes:
      - ./storage:/app/storage
      - ./content:/app/content
