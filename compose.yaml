services:
  web:
    build: .
    # Next standalone server bundled into the image (see Dockerfile CMD).
    command: bun server.js
    ports:
      - "3075:3075"
    volumes:
      - ./storage:/app/storage
      - ./content:/app/content
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3075/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    # Invoke via bun: the runtime image has no node binary.
    command: bun scripts/run-git-sync-worker.mjs
    volumes:
      - ./storage:/app/storage
      - ./content:/app/content
